name: thinkpixelmem

services:
  postgres:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_DB: ${TPMEM_DEV_POSTGRES_DB:-thinkpixelmem}
      POSTGRES_PASSWORD: ${TPMEM_DEV_POSTGRES_PASSWORD:-thinkpixelmem_dev}
      POSTGRES_USER: ${TPMEM_DEV_POSTGRES_USER:-thinkpixelmem}
    ports:
      - "127.0.0.1:${TPMEM_DEV_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql

  qdrant:
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    ports:
      - "127.0.0.1:${TPMEM_DEV_QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${TPMEM_DEV_QDRANT_GRPC_PORT:-6334}:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped
    tmpfs:
      - /qdrant/storage

volumes:
  postgres-data:
